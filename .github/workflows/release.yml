name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "WorkTime v__VERSION__"
          releaseBody: |
            הורידו את המתקין המתאים ל-Windows והתקינו (התקנה למשתמש הנוכחי, ללא הרשאות מנהל).

            * `WorkTime___VERSION___x64-setup.exe` — מתקין NSIS
            * `WorkTime___VERSION___x64_en-US.msi` — חבילת MSI

            פירוט מלא של מה חדש בגרסה נמצא בקובץ `CHANGELOG.md` במאגר.
          releaseDraft: false
          prerelease: false
