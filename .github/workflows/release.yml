name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run release:check

      - name: Typecheck and build frontend
        run: npm run build

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $lines = Get-Content CHANGELOG.md
          $heading = $lines | Select-String -SimpleMatch "## [$version]" | Select-Object -First 1
          if (-not $heading) { throw "CHANGELOG.md has no section for version $version" }
          $rest = $lines[$heading.LineNumber..($lines.Count - 1)]
          $next = $rest | Select-String -Pattern '^## \[' | Select-Object -First 1
          $section = if ($next) { $rest[0..($next.LineNumber - 2)] } else { $rest }
          $footer = @(
            '',
            '---',
            'הורידו את המתקין המתאים ל-Windows והתקינו (התקנה למשתמש הנוכחי, ללא הרשאות מנהל):',
            '',
            '- `WorkTime_..._x64-setup.exe` — מתקין NSIS',
            '- `WorkTime_..._x64_en-US.msi` — חבילת MSI'
          ) -join "`n"
          $body = (($section -join "`n").TrimEnd() + "`n`n" + $footer)
          "body<<__WORKTIME_NOTES__" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "__WORKTIME_NOTES__" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "WorkTime v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
